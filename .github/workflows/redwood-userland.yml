name: redwood-userland

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "userland/**"
      - ".github/workflows/redwood-userland.yml"

permissions:
  contents: read

concurrency:
  group: redwood-userland-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: oosexgang/hackios-xnu-userland
          ref: a79ff0772a3454fd1ef127e181e5b3bce6c9ce18
          path: hackios-userland

      - name: Apply the 20H392 offset overlay
        run: git -C hackios-userland apply "$GITHUB_WORKSPACE/userland/patches/20H392-redwood.patch"

      - name: Build the arm64 Redwood libraries
        run: bash userland/build-redwood.sh hackios-userland/userland/src out

      - uses: actions/upload-artifact@v4
        with:
          name: redwood-20H392
          path: out/
          if-no-files-found: error
          retention-days: 14
